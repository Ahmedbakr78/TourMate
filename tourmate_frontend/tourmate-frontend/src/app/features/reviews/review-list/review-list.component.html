<div class="page-header">
  <h1>Reviews</h1>
  <a mat-raised-button color="primary" routerLink="/reviews/create">
    <mat-icon>add</mat-icon> New review
  </a>
</div>

<mat-chip-listbox class="filter-chips" [value]="activeFilter" (change)="setFilter($event.value)">
  <mat-chip-option *ngFor="let t of reviewTypes" [value]="t.value">{{ t.label }}</mat-chip-option>
</mat-chip-listbox>

<app-loading *ngIf="loading"></app-loading>

<div *ngIf="!loading">
  <div class="table-wrapper">
    <table mat-table [dataSource]="filteredReviews" class="reviews-table">

      <ng-container matColumnDef="reviewer">
        <th mat-header-cell *matHeaderCellDef>Reviewer</th>
        <td mat-cell *matCellDef="let review">{{ getReviewerName(review) }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let review">
          <mat-chip highlighted [color]="getReviewType(review) === 'place' ? 'accent' : 'primary'">
            {{ getReviewType(review) | titlecase }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="rating">
        <th mat-header-cell *matHeaderCellDef>Rating</th>
        <td mat-cell *matCellDef="let review" class="stars-cell">
          <span *ngFor="let s of stars(review.rating)" class="star" [class.filled]="s === '★'">{{ s }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="comment">
        <th mat-header-cell *matHeaderCellDef>Comment</th>
        <td mat-cell *matCellDef="let review" class="comment-cell">{{ review.comment || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let review">{{ review.createdAt | date : 'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let review">
          <button mat-icon-button color="primary" [routerLink]="['/reviews/edit', review._id]">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <p *ngIf="filteredReviews.length === 0" class="empty">No reviews found.</p>

  <mat-paginator
    [length]="totalDocs"
    [pageSize]="limit"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
